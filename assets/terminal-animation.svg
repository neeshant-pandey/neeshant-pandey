<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="500" viewBox="0 0 900 500">
  <style>
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes spin {
      0% { content: '⠋'; }
      12.5% { content: '⠙'; }
      25% { content: '⠹'; }
      37.5% { content: '⠸'; }
      50% { content: '⠼'; }
      62.5% { content: '⠴'; }
      75% { content: '⠦'; }
      87.5% { content: '⠧'; }
      100% { content: '⠇'; }
    }

    .terminal-bg {
      fill: #0d1117;
    }

    .terminal-header {
      fill: #161b22;
    }

    .window-button {
      fill: #ff5f56;
    }

    .window-button.yellow {
      fill: #ffbd2e;
    }

    .window-button.green {
      fill: #27c93f;
    }

    text {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .prompt { fill: #58a6ff; font-weight: 600; }
    .user { fill: #7ee787; font-weight: 500; }
    .path { fill: #d29922; }
    .command { fill: #f0f6fc; }
    .flag { fill: #bc8cff; }
    .success { fill: #3fb950; }
    .info { fill: #58a6ff; }
    .warn { fill: #d29922; }
    .metric { fill: #79c0ff; }
    .value { fill: #7ee787; font-weight: 600; }
    .comment { fill: #8b949e; font-style: italic; }

    /* Animation delays */
    .a0 { animation: fadeIn 0.3s ease-in 0.5s both; }
    .a1 { animation: fadeIn 0.3s ease-in 1.2s both; }
    .a2 { animation: fadeIn 0.3s ease-in 1.8s both; }
    .a3 { animation: fadeIn 0.3s ease-in 2.3s both; }
    .a4 { animation: fadeIn 0.3s ease-in 3.0s both; }
    .a5 { animation: fadeIn 0.3s ease-in 3.4s both; }
    .a6 { animation: fadeIn 0.3s ease-in 3.8s both; }
    .a7 { animation: fadeIn 0.3s ease-in 4.2s both; }
    .a8 { animation: fadeIn 0.3s ease-in 4.8s both; }
    .a9 { animation: fadeIn 0.3s ease-in 5.4s both; }
    .a10 { animation: fadeIn 0.3s ease-in 6.0s both; }
    .a11 { animation: fadeIn 0.3s ease-in 6.6s both; }
    .a12 { animation: fadeIn 0.3s ease-in 7.2s both; }
    .a13 { animation: fadeIn 0.3s ease-in 7.8s both; }
    .a14 { animation: fadeIn 0.3s ease-in 8.4s both; }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cursor {
      animation: blink 1s step-end infinite;
      fill: #7ee787;
    }
  </style>

  <!-- Background -->
  <rect class="terminal-bg" width="900" height="500" rx="10"/>

  <!-- Header Bar -->
  <rect class="terminal-header" width="900" height="35" rx="10"/>
  <circle class="window-button" cx="20" cy="17.5" r="6"/>
  <circle class="window-button yellow" cx="45" cy="17.5" r="6"/>
  <circle class="window-button green" cx="70" cy="17.5" r="6"/>

  <!-- Terminal Title -->
  <text x="450" y="23" text-anchor="middle" class="comment" font-size="12px">
    neeshant@mlops-prod: ~/production-pipelines
  </text>

  <!-- Terminal Content -->
  <g transform="translate(20, 60)">

    <!-- Command 1: Pipeline Execution -->
    <g class="a0">
      <text y="0">
        <tspan class="user">neeshant</tspan><tspan class="prompt">@</tspan><tspan class="user">mlops-prod</tspan><tspan class="prompt">:</tspan><tspan class="path">~/prod</tspan><tspan class="prompt">$</tspan>
        <tspan class="command" dx="10">dagster pipeline execute</tspan>
        <tspan class="flag" dx="5">--config</tspan>
        <tspan class="command" dx="5">production.yaml</tspan>
      </text>
    </g>

    <!-- Loading -->
    <g class="a1">
      <text y="25" class="info">⠋ Loading pipeline configuration...</text>
    </g>

    <!-- Data Validation -->
    <g class="a2">
      <text y="50" class="success">✓ Data validation passed</text>
      <tspan class="comment" dx="10">(2.3s)</tspan>
    </g>

    <!-- Training Start -->
    <g class="a3">
      <text y="75" class="info">⠋ Training model on 10M samples...</text>
    </g>

    <!-- Epoch Progress -->
    <g class="a4">
      <text y="100" class="metric">  ├─ Epoch 1/10</text>
      <tspan class="comment" dx="10">loss:</tspan>
      <tspan class="warn" dx="5">0.234</tspan>
      <tspan class="comment" dx="10">acc:</tspan>
      <tspan class="value" dx="5">0.891</tspan>
    </g>

    <g class="a5">
      <text y="125" class="metric">  ├─ Epoch 5/10</text>
      <tspan class="comment" dx="10">loss:</tspan>
      <tspan class="value" dx="5">0.098</tspan>
      <tspan class="comment" dx="10">acc:</tspan>
      <tspan class="value" dx="5">0.963</tspan>
    </g>

    <g class="a6">
      <text y="150" class="metric">  └─ Epoch 10/10</text>
      <tspan class="comment" dx="9">loss:</tspan>
      <tspan class="value" dx="5">0.051</tspan>
      <tspan class="comment" dx="10">acc:</tspan>
      <tspan class="value" dx="5">0.987</tspan>
      <tspan class="success" dx="10">✓</tspan>
      <tspan class="comment" dx="5">(47.2s)</tspan>
    </g>

    <!-- Deployment -->
    <g class="a7">
      <text y="180" class="success">✓ Model registered</text>
      <tspan class="comment" dx="10">version: v2.1.4</tspan>
    </g>

    <g class="a8">
      <text y="205" class="success">✓ Model deployed to production</text>
      <tspan class="comment" dx="10">3 replicas</tspan>
    </g>

    <g class="a9">
      <text y="230" class="success">✓ Monitoring alerts configured</text>
    </g>

    <!-- Command 2: Check Status -->
    <g class="a10">
      <text y="270">
        <tspan class="user">neeshant</tspan><tspan class="prompt">@</tspan><tspan class="user">mlops-prod</tspan><tspan class="prompt">:</tspan><tspan class="path">~/prod</tspan><tspan class="prompt">$</tspan>
        <tspan class="command" dx="10">kubectl get pods</tspan>
        <tspan class="flag" dx="5">-n</tspan>
        <tspan class="command" dx="5">ml-production</tspan>
      </text>
    </g>

    <!-- Kubectl Output Header -->
    <g class="a11">
      <text y="295" class="comment">NAME                          READY   STATUS    RESTARTS   AGE</text>
    </g>

    <!-- Pod Statuses -->
    <g class="a12">
      <text y="320">
        <tspan class="value">model-server-v2-7f9c8d-xk2p9</tspan>
        <tspan class="success" dx="15">2/2</tspan>
        <tspan class="success" dx="20">Running</tspan>
        <tspan class="metric" dx="20">0</tspan>
        <tspan class="comment" dx="25">23s</tspan>
      </text>
    </g>

    <g class="a13">
      <text y="345">
        <tspan class="value">prometheus-monitor-8d4f2</tspan>
        <tspan class="success" dx="40">1/1</tspan>
        <tspan class="success" dx="20">Running</tspan>
        <tspan class="metric" dx="20">0</tspan>
        <tspan class="comment" dx="25">47d</tspan>
      </text>
    </g>

    <g class="a14">
      <text y="370">
        <tspan class="value">kafka-stream-processor-df21x</tspan>
        <tspan class="success" dx="18">1/1</tspan>
        <tspan class="success" dx="20">Running</tspan>
        <tspan class="metric" dx="20">0</tspan>
        <tspan class="comment" dx="25">12d</tspan>
      </text>
    </g>

    <!-- Cursor -->
    <g class="a14">
      <text y="410">
        <tspan class="user">neeshant</tspan><tspan class="prompt">@</tspan><tspan class="user">mlops-prod</tspan><tspan class="prompt">:</tspan><tspan class="path">~/prod</tspan><tspan class="prompt">$</tspan>
      </text>
      <rect class="cursor" x="210" y="396" width="10" height="16"/>
    </g>

  </g>
</svg>